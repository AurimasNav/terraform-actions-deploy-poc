name: Deploy

on:
  push:
    branches: [main]
    paths: ["src/**"]
  workflow_dispatch:
    inputs:
      modules:
        description: Root modules to deploy, comma-separated, or all
        default: all
      fail_test:
        description: Root module whose Deploy test fails
        default: ""

permissions:
  contents: read

jobs:
  changes:
    name: Changed root modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.select.outputs.modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        env:
          SELECTION: ${{ inputs.modules }}
          BEFORE: ${{ github.event.before }}
        run: bash scripts/changed-root-modules.sh

  root-module:
    name: ${{ matrix.module }}
    needs: changes
    if: needs.changes.outputs.modules != '[]'
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.modules) }}
    uses: ./.github/workflows/root-module.yml
    with:
      module: ${{ matrix.module }}
      fail_test: ${{ inputs.fail_test == matrix.module }}
