name: Deploy

on:
  push:
    branches: [main]
    paths: ["src/**"]
  workflow_dispatch:
    inputs:
      modules:
        description: Root modules to deploy, comma-separated, or all
        default: all
      fail_test:
        description: Root module whose Deploy test fails
        default: ""

permissions:
  contents: read

jobs:
  changes:
    name: Changed root modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.select.outputs.modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        env:
          SELECTION: ${{ inputs.modules }}
          BEFORE: ${{ github.event.before }}
        run: bash scripts/changed-root-modules.sh

  check-jobs:
    name: Every root module has jobs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/check-deploy-jobs.sh

  shared-x-test:
    name: shared-x
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.modules), 'shared-x')
    uses: ./.github/workflows/terraform-apply.yml
    with: { module: shared-x, environment: test }
  shared-x-plan:
    name: shared-x
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.modules), 'shared-x')
    uses: ./.github/workflows/terraform-plan.yml
    with: { module: shared-x, environment: prod }
  shared-x-prod:
    name: shared-x
    needs: [shared-x-test, shared-x-plan]
    uses: ./.github/workflows/terraform-apply.yml
    with: { module: shared-x, environment: prod, saved_plan: true }

  shared-y-test:
    name: shared-y
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.modules), 'shared-y')
    uses: ./.github/workflows/terraform-apply.yml
    with: { module: shared-y, environment: test }
  shared-y-plan:
