name: Terraform plan

on:
  workflow_call:
    inputs:
      module:
        type: string
        required: true
      environment:
        type: string
        required: true
      ref:
        description: Commit to check out; empty for the run's commit
        type: string
        default: ""

permissions:
  contents: read

jobs:
  plan:
    name: Plan ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/terraform
        with:
          module: ${{ inputs.module }}
          workspace: ${{ inputs.environment }}
          command: plan
          plan-file: plan/${{ inputs.module }}.tfplan
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan-${{ inputs.environment }}-${{ inputs.module }}
          path: plan/
          retention-days: 7
