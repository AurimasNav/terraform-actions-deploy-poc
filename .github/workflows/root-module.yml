name: Root module
run-name: Deploy ${{ inputs.module }}

on:
  workflow_call:
    inputs:
      module:
        type: string
        required: true
      ref:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      module:
        description: Root module, a folder under src/
        required: true
      ref:
        description: Commit to deploy
        required: true
      fail_test:
        description: Root module whose Deploy test fails
        default: ""

permissions:
  contents: read

jobs:
  deploy-test:
    uses: ./.github/workflows/terraform-apply.yml
    with:
      module: ${{ inputs.module }}
      environment: test
      ref: ${{ inputs.ref }}

  plan-prod:
    uses: ./.github/workflows/terraform-plan.yml
    with:
      module: ${{ inputs.module }}
      environment: prod
      ref: ${{ inputs.ref }}

  deploy-prod:
    needs: [deploy-test, plan-prod]
    uses: ./.github/workflows/terraform-apply.yml
    with:
      module: ${{ inputs.module }}
      environment: prod
      ref: ${{ inputs.ref }}
      saved_plan: true
