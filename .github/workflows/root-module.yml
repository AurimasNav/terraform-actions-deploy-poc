name: Root module

on:
  workflow_call:
    inputs:
      module:
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy-test:
    uses: ./.github/workflows/terraform-apply.yml
    with:
      module: ${{ inputs.module }}
      environment: test

  plan-prod:
    uses: ./.github/workflows/terraform-plan.yml
    with:
      module: ${{ inputs.module }}
      environment: prod

  deploy-prod:
    needs: [deploy-test, plan-prod]
    uses: ./.github/workflows/terraform-apply.yml
    with:
      module: ${{ inputs.module }}
      environment: prod
      saved_plan: true
